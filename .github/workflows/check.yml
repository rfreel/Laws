name: constitution-bend-check

on:
  push:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static inventory and proof audit
        run: python tools/static_audit.py

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '@unsafe|\?TODO|^[[:space:]]*def[[:space:]]+[A-Za-z0-9_.]+\?' \
            --include='*.bend' \
            --exclude-dir='.bend-prefix' \
            --exclude-dir='.git' \
            --exclude-dir='__pycache__' \
            .; then
            echo 'unsafe Bend proof escape detected' >&2
            exit 1
          fi
          grep -F 'import ./LAWS.bend as Laws' PROOF.bend >/dev/null

      - name: Install pinned Bend
        shell: bash
        run: |
          set -euo pipefail
          sudo bash tools/install_bend.sh
          bend --help >/tmp/bend-help.txt
          test -s /tmp/bend-help.txt

      - name: Check proof gate
        run: bend PROOF.bend
